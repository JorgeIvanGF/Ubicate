      <path d="M70 108v19c0 14 8 22 23 22s23-8 23-22v-19" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="139" cy="80" r="12" fill="#D7F46B"/>
      <text x="190" y="128" fill="#17243A" font-size="39" font-weight="800">ubícate</text>
      <text x="28" y="256" fill="#17243A" font-size="20" font-weight="700">03 · Azul + turquesa</text>
      <text x="28" y="286" fill="#4D5C70" font-size="15">Azul principal, acentos vivos</text>
    </g>
  </g>
</svg>
