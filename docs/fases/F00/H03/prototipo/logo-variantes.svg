<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Tres variantes del logotipo de Ubícate</title>
  <desc id="desc">Tres símbolos sencillos de ubicación con una u: lima con azul, turquesa con azul oscuro y azul con turquesa y un acento lima.</desc>
  <rect width="1200" height="370" rx="28" fill="#F5F7FB"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <g transform="translate(30 30)">
      <rect width="360" height="310" rx="22" fill="#fff" stroke="#dce4f0"/>
      <path d="M93 55c-43 0-74 31-74 70 0 41 47 80 74 96 27-16 74-55 74-96 0-39-31-70-74-70Z" fill="#D7F46B"/>
      <path d="M62 98v27c0 18 11 29 31 29s31-11 31-29V98" fill="none" stroke="#185BE7" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="139" cy="80" r="12" fill="#35C7AE"/>
      <text x="190" y="128" fill="#17243A" font-size="39" font-weight="800">ubícate</text>
      <text x="28" y="256" fill="#17243A" font-size="20" font-weight="700">01 · Lima + azul</text>
      <text x="28" y="286" fill="#4D5C70" font-size="15">Lima distintiva, símbolo azul</text>
    </g>
    <g transform="translate(420 30)">
      <rect width="360" height="310" rx="22" fill="#fff" stroke="#dce4f0"/>
      <path d="M93 55c-43 0-74 31-74 70 0 41 47 80 74 96 27-16 74-55 74-96 0-39-31-70-74-70Z" fill="#35C7AE"/>
      <path d="M62 98v27c0 18 11 29 31 29s31-11 31-29V98" fill="none" stroke="#17243A" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="139" cy="80" r="12" fill="#D7F46B"/>
      <text x="190" y="128" fill="#17243A" font-size="39" font-weight="800">ubícate</text>
      <text x="28" y="256" fill="#17243A" font-size="20" font-weight="700">02 · Turquesa + lima</text>
      <text x="28" y="286" fill="#4D5C70" font-size="15">Turquesa fresco, acento lima</text>
    </g>
    <g transform="translate(810 30)">
      <rect width="360" height="310" rx="22" fill="#fff" stroke="#dce4f0"/>
      <path d="M93 55c-43 0-74 31-74 70 0 41 47 80 74 96 27-16 74-55 74-96 0-39-31-70-74-70Z" fill="#185BE7"/>
